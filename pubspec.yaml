name: baramot
description: "Принц с Барамота — офлайн-прототип детской игры о финансовой грамотности."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  video_player: ^2.11.1
  shared_preferences: ^2.5.5
  webview_flutter: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/videos/
    - assets/scenes/
    - assets/characters/
    - assets/pets/
    - assets/pets/skorohod/
    - assets/pets/tsvetik/
    - assets/pets/looks/
    - assets/tir/
